name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install ruff==0.15.4 pytest==9.0.2 PyYAML==6.0.3 mcp==1.25.0
      - name: Fatal-error lint
        run: ruff check --select E9,F63,F7,F82 .
      - name: Existing tests (fake MCP peer, no live service)
        run: python -m pytest -q
